name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, pacsarcade-stream]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install

      - run: bun biome lint src/ packages/zap-stream-api/src/

      - run: bun tsc --noEmit

      - run: bun test src packages/zap-stream-api/src/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install

      # The real app build, the same command the site is built with
      # (build:api, then vite build into build/).
      - run: bun run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: build/
          if-no-files-found: error
          retention-days: 3

  prebuilt-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build
          path: build

      # docker.yml only builds Dockerfile.ssr; the prebuilt image is built by
      # hand, so a parse/config error there ships unnoticed (this would have
      # caught e.g. a trailing comment after FROM, which Dockerfiles reject).
      # Built with podman (house rule: podman, not docker), from the real
      # build/ output of the build job above.
      - name: Build Dockerfile.prebuilt with podman from the real app build
        run: |
          podman --version
          test -f build/index.html
          podman build -f Dockerfile.prebuilt -t zap-stream-prebuilt:ci .
